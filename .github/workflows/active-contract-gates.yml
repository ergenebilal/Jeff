name: Active contract gates

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  python-compile-active:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/compile_active.py
      - run: python scripts/check_negative_fixture.py

  bridge-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r jeff2/bridge/requirements.txt
      - run: python scripts/run_active_tests.py --group bridge
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest -q scripts/test_approval_inventory.py
      - run: pytest -q
      - run: python scripts/cognitive_inventory.py --compare docs/cognitive-source-current.json

  cybergene-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r jeff2/bridge/requirements.txt
      - run: python scripts/run_active_tests.py --group contract

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff
      - run: python scripts/lint_active.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -q scripts.test_ci_secret_scan
      - run: python scripts/ci_secret_scan.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit
      - run: pip-audit -r jeff2/bridge/requirements.txt

  task-schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r jeff2/bridge/requirements.txt jsonschema
      - run: python scripts/validate_task_schema.py
