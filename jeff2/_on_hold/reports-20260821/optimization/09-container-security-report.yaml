container_security_matrix:
  - name: hmpanel-host-agent
    privileged: true
    pid_mode: host
    network: hmpanel_default
    root_bind: "/ -> /host"
    risk: CRITICAL
    finding: |
      Container host mode'da ve privileged=true ile çalışıyor.
      Tüm host dosya sistemine erişim var. Container escape
      durumunda tam host kontrolü sağlanabilir.
    recommendation: privileged kaldır, root bind'i kaldır

  - name: hmpanel-panel
    privileged: false
    docker_socket: "/var/run/docker.sock"
    risk: CRITICAL
    finding: |
      Docker socket container'a mount edilmiş. Bu, container'dan
      docker komutları çalıştırılarak yeni privileged container
      açılmasına veya mevcut container'ların manipüle edilmesine
      olanak tanır.
    recommendation: Docker socket'i kaldır veya read-only mount et

  - name: hermes-vm
    privileged: false
    bind_mounts:
      - /home/hermes/.ssh -> /root/.ssh
      - /home/hermes/.gitconfig -> /root/.gitconfig
    risk: HIGH
    finding: SSH key'leri ve git config'i container'a erişilebilir
    recommendation: SSH mount'unu kaldır

  - name: beszel-agent
    docker_socket: "/var/run/docker.sock"
    risk: MEDIUM
    finding: Monitoring için Docker socket gerekli olabilir
    recommendation: Monitoring amacını doğrula, alternatives değerlendir

