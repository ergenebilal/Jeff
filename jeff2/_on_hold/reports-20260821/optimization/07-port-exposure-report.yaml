ufw_summary:
  status: active
  default_incoming: deny
  default_outgoing: allow
  default_routed: deny
  rules:
    - "22/tcp ALLOW IN Anywhere"
    - "80/tcp ALLOW IN Anywhere"
    - "443/tcp ALLOW IN Anywhere"
    - "5678/tcp ALLOW IN Anywhere"
    - "8642/tcp ALLOW IN Anywhere"
    - "100.64.0.0/10 ALLOW IN (Tailscale)"

critical_findings:
  - finding: "Docker-published ports may bypass UFW"
    severity: HIGH
    detail: |
      UFW operates at iptables level, but Docker manipulates iptables
      directly. Ports published via Docker (-p) may be accessible even
      if UFW doesn't explicitly allow them. Ports 8000, 8090, 8765,
      8767, 6001-6002 bind to 0.0.0.0 but are not in UFW rules.
      Test with: nmap -p 8000,8090,8765,8767,6001,6002 193.164.4.149
    verification_needed: external port scan

  - finding: "n8n (5678) publicly accessible"
    severity: HIGH
    detail: |
      n8n webhook portu tüm internete açık. Eğer n8n auth
      yapılandırılmamışsa, herkes workflow'ları tetikleyebilir.
      UFW'den kaldırılıp Tailscale'e kısıtlanmalı.
    verification_needed: n8n auth durumu kontrol

  - finding: "Hermes gateway (8642) publicly accessible"
    severity: HIGH
    detail: |
      Hermes gateway portu tüm internete açık. Auth doğrulanmalı.
    verification_needed: auth mechanism check
