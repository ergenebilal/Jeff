# 19-PostgreSQL-Credential-Audit.yaml
# Generated: 2026-08-17T15:00:00+03:00
# Mod: AUDIT_ONLY

audit_metadata:
  date: 2026-08-17
  operator: jeff
  container: hmpanel-postgres
  image: postgres:15-alpine (pinned)
  database_version: "15.18"

connection_test:
  method: pg_dump
  status: SUCCESS
  user_used: panel_user
  database: panel_db
  external_port_5432: CLOSED (not exposed)
  local_socket: WORKING

users:
  - username: panel_user
    superuser: true
    createdb: true
    canlogin: true
    connlimit: -1
    is_default: true
    risk: HIGH
    finding: |
      Varsayılan compose credentials (panel_user/panel_pass) kullanılıyor olabilir.
      Superuser yetkisi var — panel_db için gerekli mi değerlendirilmeli.

roles:
  - name: panel_user
    rolsuper: true
    rolcreaterole: false
    rolcreatedb: true
    rolcanlogin: true
    rolreplication: false
  - name: pg_database_owner
    rolsuper: false
    rolcanlogin: false
  - name: pg_read_all_data
    rolsuper: false
    rolcanlogin: false
  - name: pg_write_all_data
    rolsuper: false
    rolcanlogin: false
  - name: pg_monitor
    rolsuper: false
    rolcanlogin: false
  - name: pg_read_all_settings
    rolsuper: false
    rolcanlogin: false
  - name: pg_read_all_stats
    rolsuper: false
    rolcanlogin: false
  - name: pg_stat_scan_tables
    rolsuper: false
    rolcanlogin: false
  - name: pg_read_server_files
    rolsuper: false
    rolcanlogin: false
  - name: pg_write_server_files
    rolsuper: false
    rolcanlogin: false
  - name: pg_execute_server_program
    rolsuper: false
    rolcanlogin: false
  - name: pg_signal_backend
    rolsuper: false
    rolcanlogin: false
  - name: pg_checkpoint
    rolsuper: false
    rolcanlogin: false

privilege_matrix:
  - grantee: panel_user
    schema: information_schema
    privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER]
  - grantee: panel_user
    schema: pg_catalog
    privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER]
  - grantee: panel_user
    schema: public
    privileges: [SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER]
  - grantee: PUBLIC
    schema: information_schema
    privileges: [SELECT]
  - grantee: PUBLIC
    schema: pg_catalog
    privileges: [SELECT, UPDATE]

exposure_analysis:
  listen_addresses: "*"
  port: 5432
  external_access:
    ipv4: CLOSED (connection refused)
    ipv6: CLOSED (not exposed)
    ufw: Not in UFW allow rules
    docker: Not in port mappings
  finding: |
    PostgreSQL tüm arayüzlerde dinliyor ancak Docker port mapping'i yok.
    Dışarıdan erişilemez. Yalnızca container network üzerinden erişilebilir.
    Bu durum GÜVENLİ.

pg_hba_analysis:
  local_trust: true
  localhost_trust: true
  remote_auth: "scram-sha-256"
  finding: |
    Local connections trust-based — container içinden şifre gerekmez.
    Remote connections scram-sha-256 — şifre gerekli.
    Bu yapı kabul edilebilir.

secret_exposure:
  compose_file:
    location: /opt/hmpanel/docker-compose.yml
    default_user: "${POSTGRES_USER:-panel_user}"
    default_password: "${POSTGRES_PASSWORD:-panel_pass}"
    default_db: "${POSTGRES_DB:-panel_db}"
    risk: MEDIUM
    finding: |
      Varsayılan değerler compose dosyasında. Eğer .env'de farklı değer yoksa
      panel_pass kullanılıyor olabilir. .env dosyası git'te değil.
  env_file:
    checked: .env
    secret_leaked: NOT_CONFIRMED (env file not in git)
    git_history_clean: true
  docker_inspect:
    secret_visible: true (runtime env)
    risk: LOW (root access needed)
  logs:
    secret_in_logs: false
  backup_files:
    jeff-backup_includes_db_dump: false
    risk: LOW

unused_users:
  finding: |
    pg_catalog'daki tüm roller built-in PostgreSQL rolleridir.
    panel_user haricinde login yetkisi olan kullanıcı yok.
    Kullanılmayan kullanıcı bulunmamaktadır.

rotation_recommendation:
  required: true
  urgency: HIGH
  plan: |
    1. Panel'i durdur
    2. PostgreSQL'de şifre değiştir: ALTER USER panel_user PASSWORD 'new_strong_password';
    3. .env dosyasını güncelle
    4. Panel'i yeniden başlat
    5. Bağlantıyı doğrula
  auto_apply: false (onay gerekir)

overall_risk: MEDIUM
critical_issues: 0
high_issues: 1 (default credentials risk)
medium_issues: 1 (superuser yetkisi)
low_issues: 0
