hermes_config_secrets:
  source: ~/.hermes/config.yaml
  note: |
    config.yaml'da API key'ler olabilir. Doğrulama için:
    grep -n "api_key\|token\|secret\|password" ~/.hermes/config.yaml
    Sonuç raporda gösterilmemelidir.

docker_mounted_secrets:
  - container: hmpanel-panel
    mount: /opt/hmpanel/.env
    risk: HIGH — Docker socket ile birlikte erişilebilir
    note: Panel .env dosyası container'a mount edilmiş

  - container: coolify
    mount: /data/coolify/source/.env
    risk: MEDIUM

  - container: hermes-vm
    mounts:
      - /home/hermes/.gitconfig
      - /home/hermes/.ssh
      - /home/hermes/.agentmemory
      - /home/hermes/.claude
    risk: HIGH — SSH key'leri container'a erişilebilir

git_history_scan_needed:
  status: NOT_PERFORMED
  command: "git log --all --oneline -- '*.env' '*.key' '*.pem' 'config.yaml'"
  risk: Secret'lar geçmiş commit'lerde olabilir

